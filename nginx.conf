# Nginx Reverse Proxy for SMS Gateway
# 
# Usage:
#   1. Copy to /etc/nginx/conf.d/sms-gateway.conf
#   2. Edit server_name to your domain or IP
#   3. Test: sudo nginx -t
#   4. Reload: sudo systemctl reload nginx
#
# For SSL (Let's Encrypt):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com

# HTTP server (for internal network use)
server {
    listen 8085;
    server_name _;

    # Increase body size for webhook payloads
    client_max_body_size 10M;

    # Proxy to SMS Gateway server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # SSE support (for phone push notifications)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }
}

